name: Deploy

on:
  push:
    branches: [dev, staging, main]

jobs:
  resolve-env:
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.pick.outputs.env_name }}
    steps:
      - id: pick
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)     echo "env_name=dev"     >> "$GITHUB_OUTPUT" ;;
            staging) echo "env_name=staging" >> "$GITHUB_OUTPUT" ;;
            main)    echo "env_name=prod"    >> "$GITHUB_OUTPUT" ;;
          esac

  deploy:
    needs: resolve-env
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-env.outputs.env_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python train.py

      - name: Simulate deploy
        run: |
          echo "Deploying commit ${GITHUB_SHA} to ${{ needs.resolve-env.outputs.env_name }}"
          ls -lh model.pkl

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ needs.resolve-env.outputs.env_name }}-${{ github.sha }}
          path: model.pkl
